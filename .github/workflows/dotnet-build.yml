# Automatically build RaceDay when code is pushed or a pull request is opened.
name: RaceDay .NET Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    # Run the build on a GitHub-hosted Windows computer.
    runs-on: windows-latest

    steps:
      # Download the repository's source code.
      - name: Check out repository
        uses: actions/checkout@v4

      # Install the .NET 8 SDK used by RaceDay.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Locate the solution or project file, including one in a subfolder.
      - name: Locate project
        id: project
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter *.sln -Recurse |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
            Select-Object -First 1

          if ($solution) {
            "project_path=$($solution.FullName)" >> $env:GITHUB_OUTPUT
          }
          else {
            $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
              Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
              Select-Object -First 1

            if (-not $project) {
              throw "No .sln or .csproj file was found."
            }

            "project_path=$($project.FullName)" >> $env:GITHUB_OUTPUT
          }

      # Restore the project's NuGet packages.
      - name: Restore dependencies
        run: dotnet restore "${{ steps.project.outputs.project_path }}"

      # Compile the application in Release configuration.
      - name: Build RaceDay
        run: dotnet build "${{ steps.project.outputs.project_path }}" --configuration Release --no-restore
